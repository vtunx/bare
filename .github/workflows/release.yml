name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0 (leading v is optional)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize and validate version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::invalid version '$INPUT_VERSION'; expected e.g. 0.2.0 or 0.2.0-rc.1"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Add Rust musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build static amd64 binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Verify static linking
        run: |
          bin=target/x86_64-unknown-linux-musl/release/bare
          if readelf -l "$bin" | grep -q INTERP; then
            echo "::error::binary is dynamically linked"
            exit 1
          fi
          echo "Verified: no INTERP segment (static)"

      - name: Package
        run: |
          set -euo pipefail
          asset=bare-x86_64-linux-musl
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/bare "dist/$asset"
          chmod 755 "dist/$asset"
          (cd dist && sha256sum "$asset" > "$asset.sha256")

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: bare v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/bare-x86_64-linux-musl
            dist/bare-x86_64-linux-musl.sha256
