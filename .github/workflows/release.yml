name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0 (leading v is optional)'
        required: true
        type: string

permissions:
  contents: write

env:
  RUSTFLAGS: '-C link-self-contained=yes -C linker=rust-lld'

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize and validate version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::invalid version '$INPUT_VERSION'; expected e.g. 0.2.0 or 0.2.0-rc.1"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Rust musl targets
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Build static binaries (amd64 + arm64)
        run: |
          set -euo pipefail
          cargo build --release --locked --target x86_64-unknown-linux-musl
          cargo build --release --locked --target aarch64-unknown-linux-musl

      - name: Verify static linking and architecture
        run: |
          set -euo pipefail
          amd64=target/x86_64-unknown-linux-musl/release/bare
          arm64=target/aarch64-unknown-linux-musl/release/bare
          for bin in "$amd64" "$arm64"; do
            if readelf -l "$bin" | grep -q INTERP; then
              echo "::error::$bin is dynamically linked"
              exit 1
            fi
          done
          readelf -h "$amd64" | grep -q 'Advanced Micro Devices X86-64'
          readelf -h "$arm64" | grep -q 'AArch64'
          echo "Verified: both binaries static, correct architectures"

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/bare dist/bare-amd64-linux-musl
          cp target/aarch64-unknown-linux-musl/release/bare dist/bare-arm64-linux-musl
          chmod 755 dist/bare-amd64-linux-musl dist/bare-arm64-linux-musl
          (cd dist && sha256sum bare-amd64-linux-musl bare-arm64-linux-musl > SHA256SUMS)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: bare v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/bare-amd64-linux-musl
            dist/bare-arm64-linux-musl
            dist/SHA256SUMS
