[package]
name = "bare"
version = "0.1.0"
edition = "2021"
description = "Minimal VLESS + WebSocket server, single target, zero dependencies"
license = "MIT"

[[bin]]
name = "bare"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
